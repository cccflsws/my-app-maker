<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的作品集與控制台 · AI 網頁產生器</title>
<style>
  :root {
    --bg: #05060f;
    --bg-2: #0a0f24;
    --panel: rgba(14, 20, 44, 0.72);
    --panel-border: rgba(0, 240, 255, 0.25);
    --neon: #00f0ff;
    --neon-2: #a855f7;
    --neon-3: #22ffa7;
    --text: #e8f4ff;
    --muted: #8aa0c4;
    --danger: #ff5470;
    --radius: 16px;
    --shadow: 0 0 24px rgba(0, 240, 255, 0.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(168, 85, 247, 0.18), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(0, 240, 255, 0.16), transparent 55%),
      linear-gradient(160deg, var(--bg), var(--bg-2));
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 30%, black, transparent 85%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, black, transparent 85%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(16px, 4vw, 40px);
  }
  header.hero { text-align: center; padding: clamp(18px, 5vw, 48px) 0 clamp(10px, 3vw, 28px); position: relative; }
  .badge {
    display: inline-block; font-size: 0.72rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--neon); border: 1px solid var(--panel-border); background: rgba(0, 240, 255, 0.06);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  h1 {
    font-size: clamp(1.7rem, 5.5vw, 3.1rem); line-height: 1.15; margin: 0 0 12px;
    background: linear-gradient(92deg, var(--neon), var(--neon-2) 60%, var(--neon-3));
    -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; letter-spacing: 0.5px;
  }
  .subtitle { color: var(--muted); font-size: clamp(0.9rem, 2.6vw, 1.05rem); max-width: 640px; margin: 0 auto; line-height: 1.6; }
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
    padding: clamp(18px, 4vw, 30px); margin-top: 26px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
  }

  .top-right-nav { position: absolute; top: 20px; right: 20px; z-index: 10; }
  .btn-api-settings {
    background: rgba(0, 240, 255, 0.1); border: 1px solid var(--neon); color: var(--neon);
    padding: 8px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
  }
  .btn-api-settings:hover { background: rgba(0, 240, 255, 0.25); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5, 6, 15, 0.8); backdrop-filter: blur(8px);
    z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
    padding: 28px; width: 100%; max-width: 480px; box-shadow: 0 20px 50px rgba(0,0,0,0.6), var(--shadow);
    transform: translateY(15px); transition: transform 0.25s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-box h3 { margin: 0 0 8px; font-size: 1.25rem; color: var(--text); }
  .modal-box p { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; line-height: 1.5; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .form-group input {
    width: 100%; background: rgba(5, 8, 20, 0.85); border: 1px solid var(--panel-border);
    border-radius: 10px; color: var(--text); padding: 12px 14px; font-size: 0.95rem; font-family: inherit;
  }
  .form-group input:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.18); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  #previewContainer { margin-top: 20px; display: none; }
  #previewContainer.show { display: block; }
  .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .preview-header h3 { margin: 0; font-size: 1.1rem; color: var(--text); }
  iframe#previewFrame { width: 100%; height: 500px; border: 1px solid var(--panel-border); border-radius: 12px; background: #ffffff; }


  .panel h2 { margin: 0 0 6px; font-size: clamp(1.1rem, 3.4vw, 1.4rem); display: flex; align-items: center; gap: 10px; }
  .panel h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 12px var(--neon); flex: 0 0 auto; }
  .panel .hint { color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; line-height: 1.5; }
  textarea#req {
    width: 100%; min-height: 120px; resize: vertical; background: rgba(5, 8, 20, 0.85);
    border: 1px solid var(--panel-border); border-radius: 12px; color: var(--text); font-size: 1rem;
    line-height: 1.6; padding: 16px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea#req:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.18); }
  textarea#req::placeholder { color: #5d6f92; }

  .works-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-top: 6px;
  }
  .work-card {
    position: relative;
    background: linear-gradient(160deg, rgba(0,240,255,0.06), rgba(168,85,247,0.06));
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px;
    transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }
  .work-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    padding: 1px;
    background: linear-gradient(120deg, var(--neon), transparent 40%, var(--neon-2));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .work-card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(0,0,0,0.45); }
  .work-card:hover::after { opacity: 1; }
  .work-card .w-title { font-size: 1.05rem; font-weight: 700; color: var(--text); word-break: break-word; }
  .work-card .w-meta { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; }
  .work-card .w-actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .work-card .w-actions a,
  .work-card .w-actions button {
    font-size: 0.82rem; font-weight: 600; text-decoration: none; border-radius: 9px; padding: 8px 12px;
    cursor: pointer; font-family: inherit; border: 1px solid var(--panel-border);
    background: rgba(0,240,255,0.08); color: var(--neon); transition: background 0.15s;
  }
  .work-card .w-actions a:hover, .work-card .w-actions button:hover { background: rgba(0,240,255,0.18); }
  .work-card .w-actions .del { color: var(--danger); border-color: rgba(255,84,112,0.35); }
  .work-card .w-actions .del:hover { background: rgba(255,84,112,0.14); }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 8px 2px; }
  footer {
    text-align: center; color: var(--muted); font-size: 0.78rem; padding: 34px 0 12px; letter-spacing: 0.04em;
  }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: rgba(0, 240, 255, 0.12); border: 1px solid var(--neon); color: var(--text);
    padding: 12px 20px; border-radius: 12px; font-size: 0.9rem; box-shadow: 0 8px 30px rgba(0,240,255,0.3);
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 50;
    max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 560px) {
    .actions { flex-direction: column; }
    .btn-primary { flex: 1 1 auto; }
    button.btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
  <div class="wrap">
      <div class="top-right-nav">
        <button class="btn-api-settings" id="openSettingsBtn" type="button">⚙️ API 設定</button>
      </div>
      <h1>我的作品集與控制台</h1>
      <p class="subtitle">
        用一句日常話描述你想要的網頁，按下按鈕即可產生結構化提示詞、建立新的頁面草稿，
        並把作品收錄到下方的清單中。
      </p>
    </header>

    <!-- 需求輸入 -->
    <section class="panel">
      <h2><span class="dot"></span>需求輸入</h2>
      <p class="hint">例如：「做一個每日喝水紀錄器，有 250ml 按鈕和今日總量進度條」。</p>
      <textarea id="req" placeholder="用口語描述你想要的網頁…"></textarea>
      <div class="actions">
        <button class="btn btn-primary" id="genBtn">⚡ 產生提示詞並建立新頁面</button>
        <button class="btn btn-ghost" id="clearBtn">清空</button>
      </div>

      <!-- AI 產生的即時預覽框 -->
      <div id="previewContainer">
        <div class="preview-header">
          <h3>🖥️ 即時預覽框</h3>
          <button class="btn" id="downloadBtn" type="button">⬇ 下載 HTML 按鈕</button>
        </div>
        <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
      </div>
    </section>

    <!-- 作品清單 -->
  <!-- API 設定 Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <h3>AI 服務商與 API 設定</h3>
      <p>請選擇 AI 服務商並輸入對應的 API Key 與模型名稱（會安全儲存於瀏覽器 localStorage 中）。</p>
      <div class="form-group">
        <label for="providerSelect">服務商 (Provider)</label>
        <select id="providerSelect" style="width: 100%; background: rgba(5, 8, 20, 0.85); border: 1px solid var(--panel-border); border-radius: 10px; color: var(--text); padding: 12px 14px; font-size: 0.95rem; font-family: inherit;">
          <option value="openrouter">OpenRouter</option>
          <option value="gemini">Google Gemini</option>
        </select>
      </div>
      <div class="form-group">
        <label for="apiKeyInput">API Key</label>
        <input type="password" id="apiKeyInput" placeholder="請輸入 API Key..." />
      </div>
      <div class="form-group">
        <label for="modelInput">模型名稱 (Model Name)</label>
        <input type="text" id="modelInput" placeholder="請輸入模型名稱..." />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="closeSettingsBtn" type="button">取消</button>
        <button class="btn btn-primary" id="saveSettingsBtn" type="button">儲存設定</button>
      </div>
    </div>
  </div>

    <section class="panel">
      <h2><span class="dot"></span>已建立的網頁作品</h2>
      <p class="hint">點「開啟」預覽頁面；產生的草稿可「下載」成 .html 檔，或隨時刪除。</p>
      <div class="works-grid" id="worksGrid"></div>
    </section>

    <footer>簡易 AI 網頁產生器 · 所有資料僅儲存在此瀏覽器（localStorage），不會上傳。</footer>
  </div>

  <div id="toast"></div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "ai-web-maker-works-v1";
  var PROVIDER_STORAGE = "ai_api_provider";
  var OPENROUTER_KEY_STORAGE = "openrouter_api_key";
  var OPENROUTER_MODEL_STORAGE = "openrouter_model_name";
  var GEMINI_KEY_STORAGE = "gemini_api_key";
  var GEMINI_MODEL_STORAGE = "gemini_model_name";

  var BUILTIN = [ { id: "builtin-water", name: "每日喝水紀錄器", file: "water.html", builtin: true } ];
  var els = {
    req: document.getElementById("req"),
    genBtn: document.getElementById("genBtn"),
    clearBtn: document.getElementById("clearBtn"),
    worksGrid: document.getElementById("worksGrid"),
    toast: document.getElementById("toast"),
    openSettingsBtn: document.getElementById("openSettingsBtn"),
    settingsModal: document.getElementById("settingsModal"),
    closeSettingsBtn: document.getElementById("closeSettingsBtn"),
    saveSettingsBtn: document.getElementById("saveSettingsBtn"),
    providerSelect: document.getElementById("providerSelect"),
    apiKeyInput: document.getElementById("apiKeyInput"),
    modelInput: document.getElementById("modelInput"),
    previewContainer: document.getElementById("previewContainer"),
    previewFrame: document.getElementById("previewFrame"),
    downloadBtn: document.getElementById("downloadBtn")
  };
  var toastTimer = null;
  var currentGeneratedHtml = "";
  var currentRequestName = "";
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.classList.remove("show"); }, 2200);
  }
  function loadWorks() {
    try { var raw = localStorage.getItem(STORE_KEY); var arr = raw ? JSON.parse(raw) : []; return Array.isArray(arr) ? arr : []; }
    catch (e) { return []; }
  }
  function saveWorks(arr) { try { localStorage.setItem(STORE_KEY, JSON.stringify(arr)); } catch (e) {} }
  // API Settings Modal handlers & Provider switching
  function loadProviderSettings(provider) {
    if (provider === "gemini") {
      els.apiKeyInput.value = localStorage.getItem(GEMINI_KEY_STORAGE) || "";
      els.modelInput.value = localStorage.getItem(GEMINI_MODEL_STORAGE) || "gemini-3.5-flash-lite";
      els.apiKeyInput.placeholder = "AIzaSy...";
    } else {
      els.apiKeyInput.value = localStorage.getItem(OPENROUTER_KEY_STORAGE) || "";
      els.modelInput.value = localStorage.getItem(OPENROUTER_MODEL_STORAGE) || "google/gemini-2.5-flash";
      els.apiKeyInput.placeholder = "sk-or-v1-...";
    }
  }

  function initSettings() {
    var savedProvider = localStorage.getItem(PROVIDER_STORAGE) || "openrouter";
    els.providerSelect.value = savedProvider;
    loadProviderSettings(savedProvider);
  }

  els.providerSelect.addEventListener("change", function() {
    var provider = els.providerSelect.value;
    loadProviderSettings(provider);
  });

  els.openSettingsBtn.addEventListener("click", function() {
    initSettings();
    els.settingsModal.classList.add("show");
  });

  els.closeSettingsBtn.addEventListener("click", function() {
    els.settingsModal.classList.remove("show");
  });

  els.saveSettingsBtn.addEventListener("click", function() {
    var provider = els.providerSelect.value;
    var key = els.apiKeyInput.value.trim();
    var defaultModel = provider === "gemini" ? "gemini-3.5-flash-lite" : "google/gemini-2.5-flash";
    var model = els.modelInput.value.trim() || defaultModel;

    localStorage.setItem(PROVIDER_STORAGE, provider);
    if (provider === "gemini") {
      localStorage.setItem(GEMINI_KEY_STORAGE, key);
      localStorage.setItem(GEMINI_MODEL_STORAGE, model);
    } else {
      localStorage.setItem(OPENROUTER_KEY_STORAGE, key);
      localStorage.setItem(OPENROUTER_MODEL_STORAGE, model);
    }
    els.settingsModal.classList.remove("show");
    toast("API 設定已儲存！");
  });
  function buildPrompt(req) {
    var clean = req.trim().replace(/\s+/g, " ");
    return [
      "你是一位專業的前端工程師與 UI/UX 設計師。",
      "",
      "【目標】請打造一個網頁，需求如下：",
      clean,
      "",
      "【功能需求】",
      "- 依需求實作所有核心功能，操作流程直覺。",
      "- 資料需可持續保存（例如使用 localStorage）。",
      "- 提供清楚的狀態回饋與操作提示。",
      "",
      "【設計風格】",
      "- 具科技感、現代化的介面，配色和諧。",
      "- 完整響應式設計，手機與電腦皆適用。",
      "",
      "【技術與輸出】",
      "- 使用單一 HTML 檔（內含 CSS 與 JavaScript），無需外部相依。",
      "- 產出完整、可直接執行的程式碼，不要省略或留白。",
      "",
      "【驗收】請確保功能可用、版面在手機上不會破版。"
    ].join("\n");
  }

  function buildPageHtml(req, prompt) {
    var safeReq = escapeHtml(req.trim() || "我的新網頁");
    var safePrompt = escapeHtml(prompt);
    return [
      "<!DOCTYPE html>",
      '<html lang="zh-Hant"><head><meta charset="UTF-8" />',
      '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
      "<title>" + safeReq + " · 草稿</title>",
      "<style>",
      ":root{--neon:#00f0ff;--neon2:#a855f7;--text:#e8f4ff;--muted:#8aa0c4;}",
      "*{box-sizing:border-box;}",
      "body{margin:0;font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;",
      "color:var(--text);background:radial-gradient(1000px 500px at 110% 0%,rgba(0,240,255,.16),transparent 55%),",
      "radial-gradient(900px 500px at 0% 0%,rgba(168,85,247,.18),transparent 55%),linear-gradient(160deg,#05060f,#0a0f24);",
      "min-height:100vh;padding:clamp(16px,4vw,40px);}",
      ".wrap{max-width:820px;margin:0 auto;}",
      ".badge{display:inline-block;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--neon);",
      "border:1px solid rgba(0,240,255,.25);background:rgba(0,240,255,.06);padding:6px 14px;border-radius:999px;margin-bottom:18px;}",
      "h1{font-size:clamp(1.5rem,5vw,2.6rem);line-height:1.2;margin:0 0 14px;",
      "background:linear-gradient(92deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent;}",
      ".card{background:rgba(14,20,44,.72);border:1px solid rgba(0,240,255,.25);border-radius:16px;",
      "padding:clamp(18px,4vw,28px);backdrop-filter:blur(14px);box-shadow:0 0 24px rgba(0,240,255,.15);margin-top:22px;}",
      ".card h2{margin:0 0 10px;font-size:1.1rem;}",
      ".card p{color:var(--muted);line-height:1.6;margin:.4em 0;}",
      "pre{white-space:pre-wrap;word-break:break-word;font-family:Consolas,'Courier New',monospace;font-size:.85rem;",
      "color:#bfe9ff;background:rgba(3,6,16,.85);border:1px dashed rgba(0,240,255,.25);border-radius:12px;padding:14px;}",
      ".note{color:var(--muted);font-size:.82rem;margin-top:22px;text-align:center;}",
      "</style></head><body><div class=\"wrap\">",
      '<span class="badge">DRAFT · 新頁面草稿</span>',
      "<h1>" + safeReq + "</h1>",
      '<div class="card"><h2>📝 需求</h2><p>' + safeReq + "</p></div>",
      '<div class="card"><h2>🤖 產生之提示詞</h2><pre>' + safePrompt + "</pre></div>",
      '<div class="card"><h2>🚀 下一步</h2>',
      "<p>把上方提示詞貼到你的 AI 工具，即可生成完整程式碼，再取代本頁內容。</p>",
      "<p>這是一個可直接開啟的草稿骨架，方便你快速開始。</p></div>",
      '<p class="note">由「簡易 AI 網頁產生器」自動建立</p>',
      "</div></body></html>"
    ].join("\n");
  }

  function makeId() {
    return "w-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  }
  function openHtml(html) {
    var blob = new Blob([html], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var win = window.open(url, "_blank");
    if (!win) { toast("已阻擋新視窗，改為下載草稿。"); downloadHtml(html, "draft.html"); }
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  function downloadHtml(html, name) {
    var blob = new Blob([html], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name || "page.html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function renderWorks() {
    var works = loadWorks();
    var all = BUILTIN.concat(works);
    els.worksGrid.innerHTML = "";
    if (all.length === 0) { els.worksGrid.innerHTML = '<p class="empty">尚無作品，先在上方建立第一個吧！</p>'; return; }
    all.forEach(function (w) {
      var card = document.createElement("div");
      card.className = "work-card";
      var title = document.createElement("div");
      title.className = "w-title"; title.textContent = w.name;
      var meta = document.createElement("div");
      meta.className = "w-meta";
      meta.textContent = w.builtin ? "內建範例 · water.html" : "AI 草稿 · 已儲存";
      var actions = document.createElement("div");
      actions.className = "w-actions";
      if (w.builtin) {
        var openA = document.createElement("a");
        openA.href = w.file; openA.target = "_blank"; openA.rel = "noopener";
        openA.textContent = "↗ 開啟";
        actions.appendChild(openA);
      } else {
        var openBtn = document.createElement("button");
        openBtn.type = "button"; openBtn.textContent = "↗ 開啟";
        openBtn.addEventListener("click", function () { openHtml(w.html); });
        actions.appendChild(openBtn);
        var dlBtn = document.createElement("button");
        dlBtn.type = "button"; dlBtn.textContent = "⬇ 下載";
        dlBtn.addEventListener("click", function () { downloadHtml(w.html, (w.name || "page") + ".html"); });
        actions.appendChild(dlBtn);
        var delBtn = document.createElement("button");
        delBtn.type = "button"; delBtn.className = "del"; delBtn.textContent = "✕ 刪除";
        delBtn.addEventListener("click", function () {
          saveWorks(loadWorks().filter(function (x) { return x.id !== w.id; }));
          renderWorks(); toast("已刪除作品。");
        });
        actions.appendChild(delBtn);
      }
      card.appendChild(title); card.appendChild(meta); card.appendChild(actions);
      els.worksGrid.appendChild(card);
    });
  }
  // Handle Download Button click
  els.downloadBtn.addEventListener("click", function () {
    if (!currentGeneratedHtml) {
      toast("目前沒有可下載的網頁內容。");
      return;
    }
    downloadHtml(currentGeneratedHtml, (currentRequestName || "ai-page") + ".html");
    toast("已開始下載 HTML 檔案！");
  });

  // Call AI API (OpenRouter or Google Gemini)
  els.genBtn.addEventListener("click", async function () {
    var req = els.req.value.trim();
    if (!req) { toast("請先輸入你的需求。"); els.req.focus(); return; }

    var provider = localStorage.getItem(PROVIDER_STORAGE) || "openrouter";
    var apiKey = "";
    var modelName = "";

    if (provider === "gemini") {
      apiKey = localStorage.getItem(GEMINI_KEY_STORAGE) || "";
      modelName = localStorage.getItem(GEMINI_MODEL_STORAGE) || "gemini-3.5-flash-lite";
    } else {
      apiKey = localStorage.getItem(OPENROUTER_KEY_STORAGE) || "";
      modelName = localStorage.getItem(OPENROUTER_MODEL_STORAGE) || "google/gemini-2.5-flash";
    }

    if (!apiKey) {
      toast("請先點擊右上角「API 設定」輸入您的 " + (provider === "gemini" ? "Google Gemini" : "OpenRouter") + " API Key。");
      els.settingsModal.classList.add("show");
      return;
    }

    els.genBtn.disabled = true;
    els.genBtn.textContent = "⏳ AI 生成中...";
    toast("正在呼叫 " + (provider === "gemini" ? "Google Gemini" : "OpenRouter") + " 生成網頁...");

    var systemPrompt = "你是一位專業的前端工程師。請根據使用者的需求，完整實作一個單一 HTML 檔案（包含 CSS 與 JavaScript，使其具備互動功能與美觀現代的 UI）。你必須「只」回傳純 HTML 程式碼，絕對不要包含任何 markdown 程式碼區塊標記（例如 ```html 或 ```），也不要包含任何額外的解釋文字或前言後語，直接輸出完整合法的 <!DOCTYPE html> 開始。";

    try {
      var content = "";

      if (provider === "gemini") {
        var url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(modelName) + ":generateContent?key=" + encodeURIComponent(apiKey);
        var response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: systemPrompt }]
            },
            contents: [
              {
                parts: [{ text: req }]
              }
            ]
          })
        });

        if (!response.ok) {
          var errText = await response.text();
          throw new Error("Gemini API 錯誤 (" + response.status + "): " + errText);
        }

        var data = await response.json();
        content = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;

        if (!content) {
          throw new Error("Gemini AI 回傳內容為空");
        }
      } else {
        var response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + apiKey,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "AI Web Maker"
          },
          body: JSON.stringify({
            model: modelName,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: req }
            ]
          })
        });

        if (!response.ok) {
          var errText = await response.text();
          throw new Error("OpenRouter API 錯誤 (" + response.status + "): " + errText);
        }

        var data = await response.json();
        content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;

        if (!content) {
          throw new Error("OpenRouter AI 回傳內容為空");
        }
      }

      // Clean up potential markdown code blocks if the model included them despite instructions
      content = content.trim();
      if (content.startsWith("```html")) {
        content = content.replace(/^```html\s*/i, "");
      } else if (content.startsWith("```")) {
        content = content.replace(/^```\s*/, "");
      }
      if (content.endsWith("```")) {
        content = content.replace(/\s*```$/, "");
      }
      content = content.trim();

      currentGeneratedHtml = content;
      currentRequestName = req;

      // Display in iframe preview
      els.previewContainer.classList.add("show");
      var doc = els.previewFrame.contentDocument || els.previewFrame.contentWindow.document;
      doc.open();
      doc.write(content);
      doc.close();

      // Save to works list automatically
      var works = loadWorks();
      works.push({ id: makeId(), name: req, html: content });
      saveWorks(works);
      renderWorks();

      toast("網頁已成功生成並顯示於下方預覽框！");

    } catch (err) {
      console.error(err);
      toast("生成失敗: " + err.message);
    } finally {
      els.genBtn.disabled = false;
      els.genBtn.textContent = "⚡ 產生提示詞並建立新頁面";
    }
  });

  els.clearBtn.addEventListener("click", function () {
    els.req.value = "";
    els.previewContainer.classList.remove("show");
    els.previewFrame.srcdoc = "";
    currentGeneratedHtml = "";
    currentRequestName = "";
    els.req.focus();
  });
  els.copyBtn.addEventListener("click", function () {
    var text = els.promptText.value;
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("提示詞已複製！"); }, function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  });
  function fallbackCopy(text) {
    els.promptText.focus(); els.promptText.select();
    try { document.execCommand("copy"); toast("提示詞已複製！"); } catch (e) { toast("請手動複製提示詞。"); }
  }
  renderWorks();
})();
</script>
</body>
</html>
